# ボタンに出す名前
name = "再起動"
# アイコン: https://lucide.dev/icons から選んで、名前を書いてください
icon = "rotate-cw"
# 押したときに確認を出します。書いた文が説明になります(確認が要らなければ行ごと消す)
confirm = "開いているアプリはすべて閉じられます。\n保存していないデータは消えてしまいます。"
# 実行するファイル。フォルダに実行できるファイルが 1 つなら書かなくてよい
# run = "restart.ps1"
# 終わるまで待ち、失敗(終了コードが 0 以外)をスマホに知らせたいときは # を外す。
# 15 秒ほどで終わるものだけに付ける。長く動くものには付けない(.ps1 .bat など、スクリプトだけ)
# wait = true
