name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # 手順の if から secrets は直接見えないので、有無だけ env に写す
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Windows の zip は pwsh の Compress-Archive で作る(ubuntu の runner に入っている)
      - run: sh ci/build-dist.sh "$GITHUB_REF_NAME"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS
      # 配布のページにも同じ物を載せる。トークンが無い間(手元から出している間)は飛ばす。
      # 出し先を変えるときは、リポジトリの変数 KIDO_SITE_DOMAIN・KIDO_SITE_NAME を設定する
      - name: deploy site
        if: env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: sh ci/deploy-site.sh "${{ vars.KIDO_SITE_DOMAIN || 'pc.kido.page' }}" "${{ vars.KIDO_SITE_NAME || 'kido-agent-site' }}"
