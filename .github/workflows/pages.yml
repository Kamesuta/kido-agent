name: pages

# pc.kido.page(案内のページとインストールの手順)を出す。
# 非公開のリポジトリでは無料の契約だと Pages を使えず、ここは失敗する(公開後に通る)。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # 手順の本物は install/ に 1 つだけ置き、出すときに写す(2 つを手で合わせない)
      - run: cp install/install.ps1 install/install.sh site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
